<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediCore CBE</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50"><div class="max-w-7xl mx-auto p-4">
<div class="bg-white rounded-2xl p-5 shadow flex justify-between items-center">
<h1 class="text-2xl font-black">MediCore <span class="text-blue-600">CBE</span> <span class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded-full">● LIVE</span></h1>
<button onclick="document.getElementById('m').classList.remove('hidden');document.getElementById('m').classList.add('flex')" class="bg-black text-white px-6 py-3 rounded-full font-bold">+ Add Hospital</button>
</div><div id="grid" class="grid md:grid-cols-3 gap-4 mt-5"></div></div>
<div id="m" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
<div class="bg-white rounded-2xl p-6 w-full max-w-md">
<h2 class="font-bold text-xl mb-3">Add Hospital</h2>
<input id="n" placeholder="Hospital Name" class="w-full border p-3 rounded-xl mb-2">
<input id="a" placeholder="Area" class="w-full border p-3 rounded-xl mb-2">
<input id="c" placeholder="Contact" class="w-full border p-3 rounded-xl mb-2">
<input id="b" placeholder="Beds" type="number" class="w-full border p-3 rounded-xl mb-2">
<input id="d" placeholder="Doctors" type="number" class="w-full border p-3 rounded-xl mb-2">
<input id="s" value="Online Consultation, Video Call, Cardiology" class="w-full border p-3 rounded-xl mb-3">
<button onclick="addH()" class="w-full bg-black text-white py-3 rounded-xl font-bold">Add to LIVE →</button>
<button onclick="document.getElementById('m').classList.add('hidden')" class="w-full mt-2 bg-gray-200 py-2 rounded-xl">Cancel</button>
</div></div>
<script>
let h=JSON.parse(localStorage.getItem('hos'))||[
{name:"Ganga Hospital",area:"Mettupalayam Road",contact:"0422-2485000",beds:650,doctors:210,specs:["Orthopedics","Online Consultation"],rating:4.9},
{name:"PSG Hospitals",area:"Peelamedu",contact:"0422-2570170",beds:1200,doctors:380,specs:["Cardiac","Online Consultation"],rating:4.7},
{name:"Kovai Medical Center",area:"Avinashi Road",contact:"0422-4321000",beds:800,doctors:250,specs:["Cardiology","Online Consultation"],rating:4.5},
{name:"Royal Care",area:"Neelambur",contact:"0422-2225000",beds:300,doctors:90,specs:["Online Consultation"],rating:4.8},
{name:"Sri Ramakrishna Hospital",area:"Avarampalayam",contact:"0422-4500000",beds:1000,doctors:300,specs:["Online Consultation"],rating:4.8},
{name:"Gem Hospital",area:"Ramanathapuram",contact:"0422-2321234",beds:250,doctors:80,specs:["Gastroenterology","Online Consultation","Video Call"],rating:4.9}
];
function render(){document.getElementById('grid').innerHTML=h.map(x=>`<div class="bg-white rounded-2xl p-5 shadow border-2 border-green-100"><div class="flex justify-between"><b>${x.name}</b><span class="text-blue-600 font-bold">${x.rating} ★</span></div><p class="text-xs text-gray-500">${x.area}</p><div class="flex gap-1 flex-wrap my-2">${x.specs.map(s=>`<span class="text-[10px] px-2 py-1 rounded-full font-bold ${s.toLowerCase().includes('online')?'bg-green-500 text-white':'bg-gray-100'}">${s}</span>`).join('')}</div><div class="flex justify-between text-center text-xs my-3"><div><b>${x.beds}</b><br>Beds</div><div><b>${x.doctors}</b><br>Doctors</div><div><b>${x.area.split(' ')[0]}</b><br>Area</div></div><a href="tel:${x.contact}" class="block bg-black text-white text-center py-3 rounded-full font-bold">📞 ${x.contact}</a><p class="text-green-600 text-xs font-bold text-center mt-2">🟢 Online Consultation Available</p></div>`).join('')}
function addH(){let o={name:document.getElementById('n').value||"New Hospital",area:document.getElementById('a').value||"Coimbatore",contact:document.getElementById('c').value||"0422-0000000",beds:parseInt(document.getElementById('b').value)||100,doctors:parseInt(document.getElementById('d').value)||20,specs:document.getElementById('s').value.split(',').map(x=>x.trim()),rating:4.8};h.unshift(o);localStorage.setItem('hos',JSON.stringify(h));render();document.getElementById('m').classList.add('hidden')}
render();
</script></body></html>
