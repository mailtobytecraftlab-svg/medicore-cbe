<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediCore CBE</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-50"><div class="max-w-7xl mx-auto p-4">
<div class="bg-white rounded-2xl p-5 shadow flex justify-between items-center">
<h1 class="text-2xl font-black">MediCore <span class="text-blue-600">CBE</span> <span class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded-full">● LIVE</span></h1>
<button onclick="openAdd()" class="bg-black text-white px-6 py-3 rounded-full font-bold">+ Add Hospital</button>
</div><div id="grid" class="grid md:grid-cols-3 gap-4 mt-5"></div></div>

<div id="addModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
<div class="bg-white rounded-2xl p-6 w-full max-w-md">
<input id="n" placeholder="Hospital Name" class="w-full border p-3 rounded-xl mb-2">
<input id="a" placeholder="Area" class="w-full border p-3 rounded-xl mb-2">
<input id="c" placeholder="Contact" class="w-full border p-3 rounded-xl mb-2">
<input id="b" placeholder="Beds" type="number" class="w-full border p-3 rounded-xl mb-2">
<input id="d" placeholder="Doctors" type="number" class="w-full border p-3 rounded-xl mb-2">
<input id="s" value="Online Consultation, Video Call" class="w-full border p-3 rounded-xl mb-3">
<button onclick="addH()" class="w-full bg-black text-white py-3 rounded-xl font-bold">Add</button>
<button onclick="closeAdd()" class="w-full mt-2 bg-gray-200 py-2 rounded-xl">Cancel</button>
</div></div>

<div id="bookModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
<div class="bg-white rounded-2xl p-6 w-full max-w-md">
<h2 class="font-black text-xl">📅 Book Consultation</h2>
<p class="text-sm text-gray-500 mb-3">Select Hospital Below - FIXED</p>
<select id="bookHos" class="w-full border-2 border-blue-200 bg-blue-50 p-3 rounded-xl mb-3 font-bold"></select>
<input id="pName" placeholder="Your Name" class="w-full border p-3 rounded-xl mb-2">
<input id="pPhone" placeholder="Phone" class="w-full border p-3 rounded-xl mb-2">
<input id="pDate" type="date" class="w-full border p-3 rounded-xl mb-2">
<button onclick="confirmBook()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold">Confirm Booking ✅</button>
<button onclick="closeBook()" class="w-full mt-2 bg-gray-100 py-2 rounded-xl">Cancel</button>
<p id="ok" class="hidden text-green-600 font-bold text-center mt-2">✅ Booked!</p>
</div></div>

<script>
let h=JSON.parse(localStorage.getItem('hos_final'))||[
{name:"Ganga Hospital",area:"Mettupalayam Road",contact:"0422-2485000",beds:650,doctors:210,specs:["Orthopedics","Online Consultation"],rating:4.9},
{name:"PSG Hospitals",area:"Peelamedu",contact:"0422-2570170",beds:1200,doctors:380,specs:["Cardiac","Online Consultation"],rating:4.7},
{name:"Kovai Medical Center",area:"Avinashi Road",contact:"0422-4321000",beds:800,doctors:250,specs:["Cardiology","Online Consultation"],rating:4.5},
{name:"Royal Care",area:"Neelambur",contact:"0422-2225000",beds:300,doctors:90,specs:["Online Consultation"],rating:4.8},
{name:"Sri Ramakrishna Hospital",area:"Avarampalayam",contact:"0422-4500000",beds:1000,doctors:300,specs:["Online Consultation"],rating:4.8},
{name:"Gem Hospital",area:"Ramanathapuram",contact:"0422-2321234",beds:250,doctors:80,specs:["Gastro","Online Consultation"],rating:4.9}
];
function render(){
document.getElementById('bookHos').innerHTML='<option value="">-- Select Hospital --</option>'+h.map(x=>`<option value="${x.name}">${x.name} - ${x.area}</option>`).join('');
document.getElementById('grid').innerHTML=h.map(x=>`<div class="bg-white rounded-2xl p-5 shadow border-2 border-green-100"><b>${x.name}</b><span class="float-right text-blue-600 font-bold">${x.rating} ★</span><p class="text-xs text-gray-500">${x.area}</p><div class="flex gap-1 flex-wrap my-2">${x.specs.map(s=>`<span class="text-[10px] px-2 py-1 rounded-full font-bold ${s.toLowerCase().includes('online')?'bg-green-500 text-white':'bg-gray-100'}">${s}</span>`).join('')}</div><button onclick="openBook('${x.name}')" class="w-full bg-blue-600 text-white py-3 rounded-full font-bold mb-2">📅 Book Online Consultation</button><a href="tel:${x.contact}" class="block bg-black text-white text-center py-2.5 rounded-full font-bold text-sm">📞 ${x.contact}</a><p class="text-green-600 text-xs font-bold text-center mt-2">🟢 Online Available</p></div>`).join('');
}
function openAdd(){document.getElementById('addModal').classList.remove('hidden');document.getElementById('addModal').classList.add('flex')}
function closeAdd(){document.getElementById('addModal').classList.add('hidden')}
function openBook(name){document.getElementById('bookModal').classList.remove('hidden');document.getElementById('bookModal').classList.add('flex');document.getElementById('ok').classList.add('hidden');setTimeout(()=>{document.getElementById('bookHos').value=name},100)}
function closeBook(){document.getElementById('bookModal').classList.add('hidden')}
function confirmBook(){let hos=document.getElementById('bookHos').value;let nm=document.getElementById('pName').value;if(!hos){alert("Hospital select pannu da!");return}if(!nm){alert("Name poda da!");return}document.getElementById('ok').classList.remove('hidden');setTimeout(()=>{closeBook();alert("✅ Booking Done! "+hos+" call pannuvanga!")},1000)}
function addH(){let o={name:document.getElementById('n').value||"New Hospital",area:document.getElementById('a').value||"Coimbatore",contact:document.getElementById('c').value||"0422-0000000",beds:parseInt(document.getElementById('b').value)||100,doctors:parseInt(document.getElementById('d').value)||20,specs:document.getElementById('s').value.split(',').map(x=>x.trim()),rating:4.8};h.unshift(o);localStorage.setItem('hos_final',JSON.stringify(h));render();closeAdd()}
render();
</script></body></html>
